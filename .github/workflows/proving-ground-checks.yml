name: Proving Ground checks

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proving-ground-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Proving Ground quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/proving-ground
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      VERCEL_ENV: preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/proving-ground/package-lock.json
      - run: npm ci
      - run: npm run check
